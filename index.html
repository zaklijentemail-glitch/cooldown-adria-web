<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cooldown Adria · Coming soon</title>
<meta name="description" content="Cooldown Adria. Coming soon.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#f4f7fb">
<meta property="og:title" content="Cooldown Adria · Coming soon">
<meta property="og:type" content="website">
<meta property="og:locale" content="hr_HR">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" as="image" href="assets/pozadina-desktop.webp" media="(min-width: 760px)">
<link rel="preload" as="image" href="assets/pozadina-mobitel.webp" media="(max-width: 759px)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #052655;
    --blue: #0795db;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; max-width: 100%; overflow: hidden; overflow: clip; }
  body {
    min-height: 100svh;
    position: relative;
    background: #f4f7fb;
    color: var(--navy);
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* Zamućena početna stranica u pozadini */
  .bg { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  .bg__page {
    position: absolute; left: 0; right: 0; top: 0;
    height: 250vw; /* omjer slike 1200 x 3000 */
    background: url("assets/pozadina-desktop.webp") top center / 100% auto no-repeat;
    filter: blur(14px) saturate(1.15);
    transform: translate3d(0, 0, 0) scale(1.05);
    animation: drift 70s ease-in-out infinite alternate;
    will-change: transform;
  }
  @keyframes drift {
    from { transform: translate3d(0, 0, 0) scale(1.05); }
    to   { transform: translate3d(0, calc(-250vw + 100vh), 0) scale(1.05); }
  }
  .bg::after {
    content: ""; position: absolute; inset: 0;
    background: rgba(244, 247, 251, .45);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }

  /* Sredina: logo i status */
  .center {
    position: relative; z-index: 1;
    min-height: 100svh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(28px, 5vh, 44px);
    padding: 24px 16px;
    text-align: center;
  }
  .logo {
    width: clamp(180px, 22vw, 300px);
    animation: blink 2.6s ease-in-out infinite;
  }
  .logo img { display: block; width: 100%; height: auto; }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: .3; }
  }

  /* Status: samo tipografija i tanka linija, bez pilule */
  .status {
    width: clamp(180px, 22vw, 300px);
    padding-top: 18px;
    border-top: 1px solid rgba(5, 38, 85, .28);
    color: var(--navy);
    font-stretch: 125%;
    font-weight: 700;
    font-size: clamp(18px, 1.75vw, 24px);
    letter-spacing: .12em;
    line-height: 1;
  }

  .copy {
    position: fixed; z-index: 1;
    right: max(16px, env(safe-area-inset-right));
    bottom: max(14px, env(safe-area-inset-bottom));
    font-size: 12px; font-weight: 500; letter-spacing: .02em;
    color: rgba(5, 38, 85, .55);
  }

  @media (max-width: 759px) {
    .center { min-height: 100dvh; gap: 28px; padding: 24px 16px 56px; }
    .logo { width: min(56vw, 210px); }
    .status { width: min(56vw, 210px); padding-top: 16px; font-size: 18px; }
    .copy { left: 0; right: 0; text-align: center; font-size: 11px; }
    .bg__page {
      left: 0; right: 0;
      height: 1153.8vw; /* omjer slike 600 x 6923 */
      background-image: url("assets/pozadina-mobitel.webp");
      animation-name: drift-m; animation-duration: 120s;
    }
    @keyframes drift-m {
      from { transform: translate3d(0, 0, 0) scale(1.06); }
      to   { transform: translate3d(0, calc(-1153.8vw + 100vh), 0) scale(1.06); }
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .bg__page { animation: none; }
    .logo { animation-duration: 5s; }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true"><div class="bg__page"></div></div>

  <main class="center">
    <div class="logo"><img src="assets/logo.svg" alt="Cooldown Adria" width="300" height="172"></div>
    <p class="status" role="status">COMING SOON</p>
  </main>
  <p class="copy">&copy; <span id="godina">2026</span> Cooldown Adria</p>
  <script>document.getElementById("godina").textContent = new Date().getFullYear();</script>
</body>
</html>
